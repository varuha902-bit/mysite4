<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<!-- FaeCursor Logo - Beautiful combined cursor and sparkles design -->
<!-- Uses currentColor for WordPress admin menu compatibility -->
<svg fill="currentColor" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" 
	 width="800px" height="800px" viewBox="0 0 70 70" enable-background="new 0 0 70 70" xml:space="preserve">
	
	<!-- Main cursor shape - flipped so tip is on left, scaled smaller -->
	<g id="cursor" transform="translate(35, 35) scale(-0.75, 0.75) translate(-35, -35)">
		<path d="M63.042,7.269L49.18,59.007L34.279,44.105L15.652,62.731L6.958,54.04l18.627-18.627l-14.28-14.281L63.042,7.269
			 M63.042,3.269c-0.346,0-0.693,0.045-1.035,0.137L10.271,17.269c-1.38,0.369-2.458,1.447-2.829,2.828
			c-0.37,1.38,0.025,2.853,1.035,3.863l11.452,11.453L4.13,51.212c-0.75,0.75-1.172,1.768-1.172,2.828
			c0,1.062,0.421,2.078,1.172,2.829l8.693,8.691c0.781,0.78,1.805,1.171,2.828,1.171c1.024,0,2.047-0.391,2.828-1.172l15.799-15.797
			l12.073,12.072c0.76,0.76,1.781,1.172,2.828,1.172c0.346,0,0.693-0.045,1.035-0.137c1.381-0.369,2.459-1.447,2.828-2.828
			L66.905,8.304c0.37-1.381-0.024-2.854-1.035-3.863C65.11,3.681,64.089,3.269,63.042,3.269L63.042,3.269z" 
			fill="currentColor" stroke="currentColor" stroke-width="0.25"/>
		
		<!-- Cursor accent lines for depth -->
		<g opacity="0.5">
			<path d="M42.435,18.491c-0.438,0-0.839-0.288-0.963-0.729c-0.149-0.532,0.16-1.084,0.692-1.233l2.788-0.783
				c0.533-0.147,1.084,0.16,1.233,0.692s-0.161,1.084-0.692,1.233l-2.788,0.783C42.614,18.479,42.523,18.491,42.435,18.491z" 
				fill="currentColor"/>
			<path d="M20.618,24.616c-0.437,0-0.838-0.288-0.962-0.729c-0.149-0.532,0.161-1.084,0.693-1.233l16.143-4.531
				c0.531-0.15,1.084,0.16,1.232,0.692c0.149,0.532-0.16,1.084-0.692,1.233l-16.143,4.531C20.798,24.604,20.707,24.616,20.618,24.616
				z" fill="currentColor"/>
		</g>
	</g>
	
	<!-- Sparkles spreading out from cursor tip (left side) to right -->
	<g id="sparkles">
		<!-- Large primary sparkle at cursor tip (left side) -->
		<g transform="translate(6.958, 7.269)">
			<path d="M0,-4.8 L1.8,-1.8 L4.8,0 L1.8,1.8 L0,4.8 L-1.8,1.8 L-4.8,0 L-1.8,-1.8 Z" fill="currentColor" opacity="0.95"/>
			<path d="M-4.8,0 L-1.8,-1.8 L0,-4.8 L1.8,-1.8 L4.8,0 L1.8,1.8 L0,4.8 L-1.8,1.8 Z" fill="currentColor" opacity="0.9"/>
			<circle cx="0" cy="0" r="2.2" fill="currentColor" opacity="0.8"/>
		</g>
		
		<!-- Medium sparkle spreading to the right from tip -->
		<g transform="translate(12, 8) rotate(15)">
			<path d="M0,-3.4 L1.3,-1.3 L3.4,0 L1.3,1.3 L0,3.4 L-1.3,1.3 L-3.4,0 L-1.3,-1.3 Z" fill="currentColor" opacity="0.9"/>
			<path d="M-3.4,0 L-1.3,-1.3 L0,-3.4 L1.3,-1.3 L3.4,0 L1.3,1.3 L0,3.4 L-1.3,1.3 Z" fill="currentColor" opacity="0.85"/>
			<circle cx="0" cy="0" r="1.5" fill="currentColor" opacity="0.75"/>
		</g>
		
		<!-- Small sparkle further right and slightly up -->
		<g transform="translate(18, 6) rotate(-20)">
			<path d="M0,-2.4 L1,-1 L2.4,0 L1,1 L0,2.4 L-1,1 L-2.4,0 L-1,-1 Z" fill="currentColor" opacity="0.85"/>
			<path d="M-2.4,0 L-1,-1 L0,-2.4 L1,-1 L2.4,0 L1,1 L0,2.4 L-1,1 Z" fill="currentColor" opacity="0.8"/>
			<circle cx="0" cy="0" r="1.1" fill="currentColor" opacity="0.7"/>
		</g>
		
		<!-- Small sparkle further right and down -->
		<g transform="translate(20, 12) rotate(30)">
			<path d="M0,-2.2 L0.85,-0.85 L2.2,0 L0.85,0.85 L0,2.2 L-0.85,0.85 L-2.2,0 L-0.85,-0.85 Z" fill="currentColor" opacity="0.85"/>
			<path d="M-2.2,0 L-0.85,-0.85 L0,-2.2 L0.85,-0.85 L2.2,0 L0.85,0.85 L0,2.2 L-0.85,0.85 Z" fill="currentColor" opacity="0.8"/>
			<circle cx="0" cy="0" r="1" fill="currentColor" opacity="0.7"/>
		</g>
		
		<!-- Tiny sparkle spreading right -->
		<g transform="translate(24, 9) rotate(-15)">
			<path d="M0,-1.7 L0.65,-0.65 L1.7,0 L0.65,0.65 L0,1.7 L-0.65,0.65 L-1.7,0 L-0.65,-0.65 Z" fill="currentColor" opacity="0.75"/>
			<path d="M-1.7,0 L-0.65,-0.65 L0,-1.7 L0.65,-0.65 L1.7,0 L0.65,0.65 L0,1.7 L-0.65,0.65 Z" fill="currentColor" opacity="0.7"/>
			<circle cx="0" cy="0" r="0.75" fill="currentColor" opacity="0.6"/>
		</g>
		
		<!-- Additional tiny sparkle spreading right and up -->
		<g transform="translate(16, 4) rotate(45)">
			<path d="M0,-1.3 L0.55,-0.55 L1.3,0 L0.55,0.55 L0,1.3 L-0.55,0.55 L-1.3,0 L-0.55,-0.55 Z" fill="currentColor" opacity="0.7"/>
			<path d="M-1.3,0 L-0.55,-0.55 L0,-1.3 L0.55,-0.55 L1.3,0 L0.55,0.55 L0,1.3 L-0.55,0.55 Z" fill="currentColor" opacity="0.65"/>
			<circle cx="0" cy="0" r="0.6" fill="currentColor" opacity="0.55"/>
		</g>
		
		<!-- More sparkles spreading further right -->
		<g transform="translate(28, 11) rotate(20)">
			<path d="M0,-1.3 L0.55,-0.55 L1.3,0 L0.55,0.55 L0,1.3 L-0.55,0.55 L-1.3,0 L-0.55,-0.55 Z" fill="currentColor" opacity="0.7"/>
			<path d="M-1.3,0 L-0.55,-0.55 L0,-1.3 L0.55,-0.55 L1.3,0 L0.55,0.55 L0,1.3 L-0.55,0.55 Z" fill="currentColor" opacity="0.65"/>
			<circle cx="0" cy="0" r="0.6" fill="currentColor" opacity="0.55"/>
		</g>
		
		<g transform="translate(32, 7) rotate(-30)">
			<path d="M0,-1.2 L0.5,-0.5 L1.2,0 L0.5,0.5 L0,1.2 L-0.5,0.5 L-1.2,0 L-0.5,-0.5 Z" fill="currentColor" opacity="0.65"/>
			<path d="M-1.2,0 L-0.5,-0.5 L0,-1.2 L0.5,-0.5 L1.2,0 L0.5,0.5 L0,1.2 L-0.5,0.5 Z" fill="currentColor" opacity="0.6"/>
			<circle cx="0" cy="0" r="0.5" fill="currentColor" opacity="0.5"/>
		</g>
	</g>
	
	<!-- Additional decorative sparkles spreading further right -->
	<g id="trail-sparkles" opacity="0.5">
		<g transform="translate(36, 10) rotate(25)">
			<path d="M0,-1 L0.4,-0.4 L1,0 L0.4,0.4 L0,1 L-0.4,0.4 L-1,0 L-0.4,-0.4 Z" fill="currentColor"/>
			<path d="M-1,0 L-0.4,-0.4 L0,-1 L0.4,-0.4 L1,0 L0.4,0.4 L0,1 L-0.4,0.4 Z" fill="currentColor"/>
			<circle cx="0" cy="0" r="0.45" fill="currentColor" opacity="0.8"/>
		</g>
		
		<g transform="translate(40, 13) rotate(-10)">
			<path d="M0,-0.85 L0.35,-0.35 L0.85,0 L0.35,0.35 L0,0.85 L-0.35,0.35 L-0.85,0 L-0.35,-0.35 Z" fill="currentColor"/>
			<path d="M-0.85,0 L-0.35,-0.35 L0,-0.85 L0.35,-0.35 L0.85,0 L0.35,0.35 L0,0.85 L-0.35,0.35 Z" fill="currentColor"/>
		</g>
		
		<g transform="translate(44, 9) rotate(35)">
			<path d="M0,-0.75 L0.3,-0.3 L0.75,0 L0.3,0.3 L0,0.75 L-0.3,0.3 L-0.75,0 L-0.3,-0.3 Z" fill="currentColor"/>
			<path d="M-0.75,0 L-0.3,-0.3 L0,-0.75 L0.3,-0.3 L0.75,0 L0.3,0.3 L0,0.75 L-0.3,0.3 Z" fill="currentColor"/>
		</g>
		
		<g transform="translate(38, 15) rotate(-25)">
			<path d="M0,-0.6 L0.25,-0.25 L0.6,0 L0.25,0.25 L0,0.6 L-0.25,0.25 L-0.6,0 L-0.25,-0.25 Z" fill="currentColor"/>
			<path d="M-0.6,0 L-0.25,-0.25 L0,-0.6 L0.25,-0.25 L0.6,0 L0.25,0.25 L0,0.6 L-0.25,0.25 Z" fill="currentColor"/>
		</g>
	</g>
</svg>
